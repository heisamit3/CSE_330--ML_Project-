mode: full
experiment_name: quick_run
seed: 42
quick_run: true
paths:
  input_dir: .
  working_dir: ./working
  train_file: train.csv
  test_file: test.csv
  misconception_file: misconception_mapping.csv
  baseline_artifacts_dir: ./working/baseline_artifacts
  kb_path: data/misconception_kb.json
  graph_path: ./working/graph/graph.gexf
  graph_summary_path: ./working/graph/graph_summary.json
  logs_dir: ./working/logs
  cache_dir: ./working/cache
  output_dir: ./working/output
data:
  group_column: QuestionId
  target_column: target
  top_k_candidates: 5
  top_k_submit: 3
  folds: 2
  max_rows: 8
baseline:
  use_external_artifacts: false
  artifact_glob: submission_*_prob.csv
  family_filter: true
  heuristic_candidate_pool: 8
llm:
  enabled: false
  backend: mock
  model_name_or_path:
  device: cpu
  dtype: float32
  load_in_4bit: false
  attn_implementation:
  max_new_tokens: 192
  temperature: 0.0
  batch_size: 1
  json_repair: true
  allow_backend_fallback: true
graphrag:
  enabled: true
  top_k_context_neighbors: 3
  max_trigger_matches: 2
  retrieve_top_n: 3
counterfactual:
  enabled: true
  top_k: 2
  min_affinity_to_run: 0.05
  min_absolute_delta_confirm: 0.10
  min_relative_delta_confirm: 0.20
ensemble:
  use_weighted_fusion: true
  use_xgboost: false
  weights:
    baseline_score: 0.20
    kb_score: 0.18
    confidence: 0.08
    ontology_support_score: 0.16
    trigger_score: 0.10
    concept_score: 0.06
    subgraph_density: 0.04
    causal_delta: 0.10
    relative_delta: 0.04
    causal_confidence: 0.02
    style_preservation_score: 0.02
runtime:
  save_every: 2
  resume: true
  force_rebuild_kb: false
  force_rebuild_graph: false